# OnePen CI/CD Pipeline
# Runs tests and deploys to Firebase Hosting on push to main

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================
  # Job 1: Core Tests (Fast)
  # ============================================
  test:
    name: Core Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install pyyaml pydantic pydantic-settings numpy pillow

      - name: Run core tests
        run: |
          pytest tests/ -v \
            --ignore=tests/test_model.py \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ============================================
  # Job 2: ML Tests (Optional, with TensorFlow)
  # ============================================
  test-ml:
    name: ML Tests
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't fail the pipeline if ML tests fail

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install pyyaml pydantic pydantic-settings numpy pillow
          pip install tensorflow

      - name: Run ML tests
        run: |
          pytest tests/test_model.py -v --tb=short || true

  # ============================================
  # Job 3: Deploy to Firebase
  # ============================================
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    needs: test  # Only depends on core tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
