# OnePen CI — app-v2 (Vite + TypeScript + Svelte 5)
# Every push / PR: unit tests, type-check, production build. No deploy —
# hosting is deployed manually (see app-v2/README.md).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Check, test, build (app-v2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-v2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # `npm run build` runs svelte-check first, then the Vite production build
      - name: Type-check + build
        run: npm run build
