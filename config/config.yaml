# OnePen Stroke Classification Configuration

project:
  name: "onepen-stroke-classifier"
  version: "1.0.0"
  description: "Real-time handwritten stroke gesture classification"

# Class definitions
classes:
  - underline
  - box
  - curly
  - delete
  - boxshortcut
  - curlyshortcut
  - circleshortcut
  - none

# Data configuration
data:
  raw_data_paths:
    - "../data/raw/ContributorQuang"
    - "../data/raw/ContributorLinh"
    - "../data/raw/ContributorSang"
    - "../data/raw/ContributorEsh"
  processed_path: "../data/processed"
  # Train/val/test split
  test_size: 0.10
  val_size: 0.16
  random_state: 42

# Augmentation configuration
augmentation:
  enabled: true
  num_augmentations: 6
  rotation_range: [-6, 6]          # degrees
  shear_x_range: [-0.2, 0.2]
  shear_y_range: [-0.1, 0.1]
  scale_x_range: [0.9, 1.1]
  scale_y_range: [0.9, 1.1]
  flip_horizontal: true
  flip_exclude_types: []           # types to exclude from flipping
  rotation_exclude_types: ["boxshortcut", "curlyshortcut", "circleshortcut"]

# Feature engineering
features:
  image_size: 96
  line_width: 3
  num_features: 12                 # 12D geometric feature vector
  antialiasing: False

  # Feature extraction parameters
  height_threshold: 45
  cap_value: 100

  # Selected features (based on ANOVA/MI analysis)
  #selected_indices: [2, 3, 5, 8, 9, 11]  # direction_bias, height_diff_45, etc.

# Model configuration
model:
  name: "modifiers_classifer"

  # Backbone options: mobilenetv3_large, mobilenetv3_small, efficientnetv2, custom_cnn
  # - mobilenetv3_large: Default, ~5MB, ImageNet pretrained
  # - mobilenetv3_small: Lighter, ~2.5MB, ImageNet pretrained
  # - efficientnetv2: Modern efficient architecture, ~7MB
  # - custom_cnn: Lightweight custom CNN, ~1MB, no pretrained weights
  backbone: "mobilenetv3_small" 

  backbone_trainable: false        # freeze backbone for stable training
  #input_shape: [136, 136, 3] #specify using image size from features instead  
  num_classes: 8
  #feature_dim: 12         

  # Architecture
  use_se_attention: true           # Squeeze-and-Excitation block
  fusion_units: [384, 192]
  dropout_rates:
    backbone: 0.25
    feature_branch: [0.25, 0.2]
    fusion: [0.35, 0.25]

# Training configuration
training:
  epochs: 200
  batch_size: 32
  learning_rate: 0.0002

  # Callbacks
  early_stopping:
    enabled: true
    patience: 35
    monitor: "val_accuracy"
    restore_best_weights: true

  reduce_lr:
    enabled: true
    factor: 0.5
    patience: 5
    min_lr: 0.000001

  # Class weights
  use_class_weights: true

# Export configuration
export:
  keras_path: "models/keras"
  tfjs_path: "models/tfjs"
  tflite_path: "models/tflite"      # optional for mobile

  # TensorFlow.js export settings
  tfjs_quantization: false          # quantize for smaller size
  tfjs_weight_shard_size: 4194304   # 4MB shards

# MLflow configuration
mlflow:
  tracking_uri: "mlruns"
  experiment_name: "onepen-stroke-classifier"
  log_models: true
  log_artifacts: true

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/training.log"
